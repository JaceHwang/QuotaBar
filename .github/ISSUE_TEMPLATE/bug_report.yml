name: Bug report
description: Report a problem with the standalone quota app.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Application version
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
      description: Remove account details and credentials from any logs or screenshots.
    validations:
      required: true
