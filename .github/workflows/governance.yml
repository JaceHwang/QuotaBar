name: Governance

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  policy:
    name: governance / policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Validate branch, PR title, and commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          chmod +x governance .githooks/* .governance/adapters/*
          if [[ "$BRANCH_NAME" != main ]]; then
            ./governance check branch "$BRANCH_NAME"
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            ./governance check title "$PR_TITLE"
          fi
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            message_file="$RUNNER_TEMP/initial-message"
            git show -s --format=%B "$HEAD_SHA" >"$message_file"
            ./governance check message "$message_file"
          else
            ./governance check commits "$BASE_SHA" "$HEAD_SHA"
          fi

  project-verification:
    name: verify / project
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Run repository verification adapter
        run: |
          set -euo pipefail
          chmod +x governance .governance/adapters/* .governance/project/*
          ./governance check all
