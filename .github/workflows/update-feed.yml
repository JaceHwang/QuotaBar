name: Publish update feed
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish release platform]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: quotabar-update-feed
  cancel-in-progress: false
jobs:
  build:
    if: vars.QUOTABAR_UPDATE_FEED_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      # Always execute the trusted default-branch generator, never a triggering artifact or PR head.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test and generate public platform feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/test-update-feed.py
          python3 scripts/generate-update-feed.py --output .dist/update-site/updates.json
          printf '%s\n' 'QuotaBar update feed. See updates.json.' > .dist/update-site/index.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .dist/update-site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy platform update feed
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
